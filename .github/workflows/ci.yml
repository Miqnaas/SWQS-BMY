name: SWQS source integrity
on:
  push:
  pull_request:
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Validate Python and research notebooks
        run: |
          python -m compileall -q ml
          python -m pytest -q

      - name: Validate deployed research assets and browser JavaScript
        run: |
          node --check docs/assets/research.js
          node --check docs/assets/experience.js
          node --check docs/assets/presentation.js
          node --check docs/assets/app.js
          node --check docs/assets/model.js
          node --check docs/assets/hero-3d.js
          node --check docs/assets/hero-static-v5.js
          node --check docs/assets/cinematic-v6.js
          node --check docs/assets/luxury-v2.js
          node --check docs/assets/visual-director-v3.js
          node --check docs/assets/sensor-architecture.js
          node --check docs/assets/identity-v4.js
          python - <<'PY'
          from pathlib import Path
          import csv, json
          root=Path('docs')
          for path in ('research.html','assets/research.css','assets/research.js','experience.html','assets/experience.css','assets/experience.js','presentation.html','assets/presentation.css','assets/presentation.js','academic/Smart_Water_Quality_Paper.pdf','academic/Smart_Water_Quality_Paper.docx','data/water_potability.csv','assets/model_manifest.json'):
              assert (root/path).is_file(), f'Missing required Pages asset: {path}'
          with (root/'data/water_potability.csv').open(newline='') as f:
              records=list(csv.DictReader(f))
          assert len(records)==3276
          assert {k:sum(not row[k] for row in records) for k in ('ph','Sulfate','Trihalomethanes')}=={'ph':491,'Sulfate':781,'Trihalomethanes':162}
          manifest=json.loads((root/'assets/model_manifest.json').read_text())
          assert len(manifest['features'])==9
          hero=(root/'index.html').read_text()
          assert 'SWQS-BMY' in hero
          assert hero.count('class="hero-water-point"')==9
          assert (root/'assets/water-hero-v2.css').is_file()
          assert (root/'assets/identity-v4.css').is_file()
          assert (root/'assets/identity-v4.js').is_file()
          assert 'identity-v4.css' in hero
          assert 'swqs-hero-message' in hero
          assert (root/'assets/cinematic-v6.css').is_file()
          assert (root/'assets/cinematic-v6.js').is_file()
          assert 'cinematic-v6.css' in hero
          assert 'hero-3d.js?v=6' in hero
          assert 'id="heroCanvas"' in hero
          assert 'swqs-v6-molecular-assembly' in hero
          assert 'swqs-v6-closing' in hero
          assert hero.count('class="swqs-v6-atom hydrogen') == 2
          assert 'sensor-architecture.js?v=3"></script>' not in hero
          assert (root/'assets/visual-director-v3.css').is_file()
          assert (root/'assets/visual-director-v3.js').is_file()
          assert (root/'assets/sensor-architecture.js').is_file()
          assert (root/'assets/team-approved-photo.webp').is_file()
          assert 'id="architecture"' in hero
          assert 'id="swqsSensorCanvas"' in hero
          assert hero.count('data-swqs-feature=') == 9
          assert 'team-approved-photo.webp' in hero
          for page in ('index.html','research.html','lab.html','experience.html','paper.html','team.html','presentation.html'):
              assert 'identity-v4.css' in (root/page).read_text(), f'v4 missing from {page}'
          print('Research website assets and original CSV verified')
          PY
